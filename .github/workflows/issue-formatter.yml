name: Issue Formatter

on:
  issues:
    types: [opened]

jobs:
  format-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const title = issue.title || '';
            const body = issue.body || '';
            const combined = (title + ' ' + body).toLowerCase();

            const labelMap = {
              'bug': [
                'bug', 'error', 'crash', 'broken', 'doesnt work',
                "doesn't work", 'no funciona', 'falla', 'glitch',
                'freeze', 'not working', 'wont work', "won't work", 'fix'
              ],
              'enhancement': [
                'feature', 'enhancement', 'add', 'new feature',
                'suggestion', 'improve', 'mejorar', 'agregar',
                'añadir', 'sugerencia', 'request', 'implement'
              ],
              'documentation': [
                'doc', 'docs', 'readme', 'documentation',
                'documentacion', 'documentación', 'typo',
                'comment', 'clarify'
              ],
              'question': [
                'question', 'how', 'how to', 'help', 'doubt',
                'pregunta', 'ayuda', 'what is', 'whats',
                'why does', 'can i'
              ]
            };

            const labelsToAdd = [];
            for (const [label, keywords] of Object.entries(labelMap)) {
              if (keywords.some(kw => combined.includes(kw))) {
                labelsToAdd.push(label);
              }
            }

            let existingLabels = new Set();
            try {
              const { data: repoLabels } = await github.rest.issues.listLabelsForRepo({
                owner, repo, per_page: 100
              });
              repoLabels.forEach(l => existingLabels.add(l.name.toLowerCase()));
            } catch (e) {
              existingLabels = new Set(['bug', 'enhancement', 'documentation', 'question']);
            }

            const validLabels = labelsToAdd.filter(l => existingLabels.has(l.toLowerCase()));

            if (validLabels.length > 0) {
              await github.rest.issues.addLabels({
                owner, repo,
                issue_number: issue.number,
                labels: validLabels
              });
            }

            const now = new Date().toISOString().split('T')[0];
            const author = issue.user.login;

            let quotedBody;
            if (!body.trim()) {
              quotedBody = '_No description provided._';
            } else {
              quotedBody = body
                .split('\n')
                .map(line => line.trim() === '' ? '>' : '> ' + line)
                .join('\n');
            }

            const labelsText = validLabels.length > 0
              ? validLabels.join(', ')
              : '_none detected_';

            const newBody =
              '## Issue Information\n' +
              '- **Author:** @' + author + '\n' +
              '- **Created:** ' + now + '\n' +
              '- **Assigned Labels:** ' + labelsText + '\n' +
              '\n' +
              '---\n' +
              '\n' +
              '## Original Comment\n' +
              '\n' +
              quotedBody + '\n' +
              '\n' +
              '---\n' +
              '\n' +
              '## Project Context\n' +
              '- **Repository:** Asteroids — HTML5 Canvas game\n' +
              '- **Main files:** `game.js`, `index.html`\n' +
              '- **Stack:** Vanilla JavaScript, no dependencies, no build tools\n' +
              '- **How to run:** Open `index.html` in a browser or run `npx serve .`';

            await github.rest.issues.update({
              owner, repo,
              issue_number: issue.number,
              body: newBody
            });
